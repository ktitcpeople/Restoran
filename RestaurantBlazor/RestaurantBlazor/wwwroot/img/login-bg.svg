<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1410"/>
      <stop offset="100%" stop-color="#0d0706"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#c8102e" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#c8102e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg)"/>
  <rect width="600" height="800" fill="url(#glow)"/>

  <!-- Wine glass -->
  <g transform="translate(140 220)" stroke="#b88746" stroke-width="3" fill="none">
    <path d="M40 0 Q40 80 90 90 Q140 80 140 0 Z" fill="rgba(200,16,46,.55)"/>
    <line x1="90" y1="90" x2="90" y2="180"/>
    <ellipse cx="90" cy="185" rx="38" ry="6" fill="#b88746" stroke="none"/>
  </g>

  <!-- Plate / dish -->
  <g transform="translate(330 320)">
    <ellipse cx="0" cy="60" rx="120" ry="22" fill="rgba(255,255,255,.07)"/>
    <ellipse cx="0" cy="50" rx="110" ry="18" fill="rgba(255,255,255,.15)" stroke="#b88746" stroke-width="2"/>
    <circle cx="-25" cy="42" r="14" fill="#c8102e"/>
    <circle cx="15" cy="46" r="10" fill="#7c2d12"/>
    <circle cx="-5" cy="38" r="7" fill="#b88746"/>
  </g>

  <!-- Steam -->
  <g stroke="rgba(255,255,255,.18)" stroke-width="2" fill="none">
    <path d="M310 280 Q295 250 320 220 Q345 190 320 160"/>
    <path d="M340 280 Q325 250 350 220 Q375 190 350 160"/>
    <path d="M370 280 Q355 250 380 220 Q405 190 380 160"/>
  </g>

  <!-- Cutlery silhouette -->
  <g transform="translate(80 460)" stroke="#b88746" stroke-width="2" fill="rgba(184,135,70,.25)">
    <rect x="0" y="0" width="14" height="220" rx="6"/>
    <path d="M0 0 L14 0 L20 -40 L-6 -40 Z"/>
  </g>
  <g transform="translate(490 460)" stroke="#b88746" stroke-width="2" fill="rgba(184,135,70,.25)">
    <rect x="0" y="0" width="14" height="220" rx="6"/>
    <path d="M-2 -40 L16 -40 L7 -10 Z"/>
  </g>

  <!-- Soft light dots -->
  <g fill="#b88746" opacity=".4">
    <circle cx="80" cy="120" r="2"/>
    <circle cx="500" cy="160" r="2"/>
    <circle cx="160" cy="650" r="2"/>
    <circle cx="450" cy="700" r="2"/>
    <circle cx="300" cy="700" r="3"/>
  </g>
</svg>
